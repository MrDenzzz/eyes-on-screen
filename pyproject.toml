[project]
name = "eyes-on-screen"
version = "0.1.0"
description = "Pauses Apple TV when the viewer looks away from the screen and resumes when they look back."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    # mediapipe already depends on the contrib build; never add opencv-python next to it,
    # both packages ship the same `cv2` module and overwrite each other.
    "opencv-contrib-python>=5.0.0.93",
    "pyatv>=0.18.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
eos = "eyes_on_screen.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
