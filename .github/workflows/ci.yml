name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes exact tags only
      # OpenCV and MediaPipe load these system libraries even without a display.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # The end-to-end tests run the real face models; the download verifies checksums.
      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('src/eyes_on_screen/vision/models.py') }}
      - run: uv run eos --config config.example.yaml download-models
      - run: uv run pytest -q
        env:
          EOS_REQUIRE_MODELS: "1"

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated protocol types match the schema
        run: npm run gen:types && git diff --exit-code src/protocol/types.ts
      - run: npm run typecheck
      - run: npm test
      - name: Committed build matches the sources
        run: npm run build && git diff --exit-code ../src/eyes_on_screen/web/static
